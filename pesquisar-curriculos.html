<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Alora - Pesquisar Currículos</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>

  <nav class="navbar">
    <span class="logo">Alora</span>
  </nav>

  <div class="conteudo">
    <a href="#" class="voltar">← Voltar</a>

    <h1>Pesquisar Currículos</h1>

    <div class="card">
      <h2>Banco de currículos</h2>
      <p class="descricao">Pesquise por nome, e-mail ou qualificações para encontrar candidatos.</p>

      <div class="busca">
        <input type="text" id="campoBusca" placeholder="Buscar por nome, e-mail ou qualificação...">
        <button id="botaoBuscar">Buscar</button>
      </div>

      <p id="mensagemBusca"></p>

      <div id="listaCurriculos"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const URL_SERVIDOR = 'https://supreme-lamp-wr9pg9pv6v6rfg4j4-3000.app.github.dev';

  const listaCurriculos = document.getElementById('listaCurriculos');
  const mensagemBusca = document.getElementById('mensagemBusca');

  function renderizarCurriculos(curriculos) {
    listaCurriculos.innerHTML = '';

    if (curriculos.length === 0) {
      mensagemBusca.textContent = 'Nenhum currículo encontrado.';
      return;
    }

    mensagemBusca.textContent = '';

    curriculos.forEach((c) => {
      const item = document.createElement('div');
      item.className = 'item-curriculo';
      item.innerHTML = `
        <h3>${c.nome}</h3>
        <p><strong>E-mail:</strong> ${c.email}</p>
        <p><strong>Telefone:</strong> ${c.telefone || 'Não informado'}</p>
        <p><strong>Qualificações:</strong> ${c.qualificacoes || 'Não informado'}</p>
        <p><strong>Experiências:</strong> ${c.experiencias || 'Não informado'}</p>
        ${c.arquivo_url ? `<a href="${c.arquivo_url}" target="_blank" class="link-arquivo">📎 Ver currículo anexado</a>` : ''}
      `;
      listaCurriculos.appendChild(item);
    });
  }

  async function carregarTodos() {
    const resposta = await fetch(`${URL_SERVIDOR}/api/curriculos`);
    const data = await resposta.json();
    renderizarCurriculos(data);
  }

  async function buscarCurriculos() {
    const termo = document.getElementById('campoBusca').value.trim();
    const resposta = await fetch(`${URL_SERVIDOR}/api/curriculos?busca=${encodeURIComponent(termo)}`);
    const data = await resposta.json();
    renderizarCurriculos(data);
  }

  document.getElementById('botaoBuscar').addEventListener('click', buscarCurriculos);
  document.getElementById('campoBusca').addEventListener('keyup', (e) => {
    if (e.key === 'Enter') buscarCurriculos();
  });

  carregarTodos();
</script>

</body>
</html>
