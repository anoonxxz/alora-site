<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alora - Login</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>

  <div class="login-split">
    <div class="login-ilustracao">
      <a href="home.html" class="logo-login">Alora</a>
      <div class="icone-cadeado">🔒</div>
    </div>

    <div class="login-form-painel">
      <h1>Login</h1>
      <p class="descricao">Informe seus dados abaixo para entrar</p>

      <form id="formLogin">
        <input type="email" id="email" placeholder="E-mail" required>
        <input type="password" id="senha" placeholder="Senha" required>
        <button type="submit">Entrar</button>
      </form>

      <p id="mensagemLogin"></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseClient = window.supabase.createClient(
      'https://nigarihewuqwahanxyxp.supabase.co',
      'sb_publishable_8fx8zXBbMhz-9UtDp0iUOA_neN3cpIq'
    );

    document.getElementById('formLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      const mensagem = document.getElementById('mensagemLogin');
      mensagem.textContent = 'Entrando...';

      const { error } = await supabaseClient.auth.signInWithPassword({
        email: document.getElementById('email').value,
        password: document.getElementById('senha').value
      });

      if (error) {
        mensagem.textContent = 'E-mail ou senha inválidos.';
        return;
      }

      window.location.href = 'pesquisar-curriculos.html';
    });
  </script>

</body>
</html>
